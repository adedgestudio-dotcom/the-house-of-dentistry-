<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Realistic 3D tooth with gradient and shadows -->
  <defs>
    <!-- Main tooth gradient (white to light purple) -->
    <linearGradient id="toothGradient" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8E4F3"/>
    </linearGradient>

    <!-- Shadow gradient -->
    <radialGradient id="shadowGradient" cx="64" cy="90" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5D5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4B5D5" stop-opacity="0"/>
    </radialGradient>

    <!-- Highlight gradient -->
    <radialGradient id="highlightGradient" cx="50" cy="40" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow at bottom -->
  <ellipse cx="64" cy="105" rx="35" ry="8" fill="url(#shadowGradient)"/>

  <!-- Main tooth body -->
  <path d="M 64 25
           C 50 25, 40 30, 35 40
           C 32 45, 30 52, 30 58
           C 30 65, 28 72, 28 78
           C 28 88, 32 98, 38 105
           C 42 110, 46 112, 50 112
           C 52 112, 54 110, 55 107
           C 57 102, 58 98, 60 95
           C 61 93, 62 92, 64 92
           C 66 92, 67 93, 68 95
           C 70 98, 71 102, 73 107
           C 74 110, 76 112, 78 112
           C 82 112, 86 110, 90 105
           C 96 98, 100 88, 100 78
           C 100 72, 98 65, 98 58
           C 98 52, 96 45, 93 40
           C 88 30, 78 25, 64 25 Z"
        fill="url(#toothGradient)"
        stroke="#E0E0E0"
        stroke-width="0.5"/>

  <!-- Top highlight (left cusp) -->
  <ellipse cx="50" cy="42" rx="12" ry="18" fill="url(#highlightGradient)" opacity="0.7"/>

  <!-- Top highlight (right cusp) -->
  <ellipse cx="78" cy="42" rx="10" ry="15" fill="url(#highlightGradient)" opacity="0.5"/>

  <!-- Center groove shadow -->
  <path d="M 64 35 Q 62 50, 62 65 Q 62 80, 62 90"
        stroke="#D8D0E8"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.4"
        fill="none"/>

  <path d="M 64 35 Q 66 50, 66 65 Q 66 80, 66 90"
        stroke="#D8D0E8"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.4"
        fill="none"/>

  <!-- Subtle side shadows for depth -->
  <path d="M 35 45 Q 32 60, 30 75 Q 28 85, 32 95"
        stroke="#D0C5E0"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.3"
        fill="none"/>

  <path d="M 93 45 Q 96 60, 98 75 Q 100 85, 96 95"
        stroke="#D0C5E0"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.3"
        fill="none"/>

  <!-- Top cusp definition -->
  <path d="M 50 30 Q 48 35, 48 42"
        stroke="#F0F0F0"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.6"
        fill="none"/>

  <path d="M 78 30 Q 80 35, 80 42"
        stroke="#F0F0F0"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.6"
        fill="none"/>
</svg>
